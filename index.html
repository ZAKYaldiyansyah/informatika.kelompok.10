<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Escape Room Kewirausahaan</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --secondary: #10b981;
            --danger: #ef4444;
            --box-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #0b1120;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #score-board {
            font-weight: bold;
            font-size: 1.1rem;
            background: var(--box-bg);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 8px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
            word-wrap: break-word;
        }

        .message.gm {
            background-color: var(--box-bg);
            align-self: flex-start;
            border-left: 4px solid var(--primary);
        }

        .message.player {
            background-color: var(--primary);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .message.system {
            background-color: rgba(255, 255, 255, 0.05);
            align-self: center;
            text-align: center;
            font-style: italic;
            font-size: 0.9rem;
            color: #cbd5e1;
            width: 100%;
        }

        .message.correct {
            border-left-color: var(--secondary);
        }

        .message.wrong {
            border-left-color: var(--danger);
        }

        #input-container {
            padding: 15px 20px;
            background-color: #0b1120;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            display: none; /* Hidden by default */
        }

        .option-btn {
            background-color: var(--box-bg);
            color: var(--text-color);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .option-btn:hover, .option-btn:active {
            background-color: var(--primary);
        }

        .text-input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: var(--box-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button#send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button#send-btn:hover {
            background-color: #2563eb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <h1>Escape Room</h1>
        <div id="score-board">Skor: 0</div>
    </header>

    <div id="chat-container"></div>

    <div id="input-container">
        <div id="options-container"></div>
        <div class="text-input-group" id="text-input-wrapper">
            <input type="text" id="user-input" placeholder="Ketik jawabanmu di sini..." autocomplete="off">
            <button id="send-btn">Kirim</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const scoreBoard = document.getElementById('score-board');
        const optionsContainer = document.getElementById('options-container');
        const textInputWrapper = document.getElementById('text-input-wrapper');

        let score = 0;
        let currentQuestionIndex = 0;
        let gameState = 'intro'; // 'intro', 'playing', 'ended'

        const questions = [
            { level: "Level 1 – Ide Usaha", q: "Apa yang dimaksud dengan kewirausahaan?", options: { A: "Kegiatan membeli barang untuk dipakai sendiri", B: "Kemampuan menciptakan dan mengembangkan usaha", C: "Menabung uang di bank", D: "Bekerja di kantor" }, answer: "B" },
            { level: "Level 1 – Ide Usaha", q: "Manakah yang termasuk peluang usaha?", options: { A: "Banyak sampah plastik di lingkungan", B: "Komputer rusak", C: "Jalan macet", D: "Cuaca panas" }, answer: "A" },
            { level: "Level 1 – Ide Usaha", q: "Mengapa kreativitas penting dalam berwirausaha?", options: { A: "Agar usaha berbeda dari pesaing", B: "Agar cepat libur", C: "Agar tidak perlu promosi", D: "Agar harga selalu mahal" }, answer: "A" },
            { level: "Level 1 – Ide Usaha", q: "Sikap utama seorang wirausahawan adalah....", options: { A: "Mudah menyerah", B: "Berani mengambil risiko", C: "Malas belajar", D: "Menunggu keberuntungan" }, answer: "B" },
            { level: "Level 1 – Ide Usaha", q: "Yang bukan merupakan ciri seorang wirausahawan adalah....", options: { A: "Disiplin", B: "Percaya diri", C: "Pemalas", D: "Kreatif" }, answer: "C" },
            
            { level: "Level 2 – Produk dan Produksi", q: "Produk yang mampu memenuhi kebutuhan pelanggan akan lebih....", options: { A: "Sulit terjual", B: "Mudah terjual", C: "Tidak dibutuhkan", D: "Tidak bernilai" }, answer: "B" },
            { level: "Level 2 – Produk dan Produksi", q: "Kemasan produk berfungsi untuk....", options: { A: "Menambah berat produk", B: "Melindungi produk dan menarik perhatian pembeli", C: "Mengurangi kualitas produk", D: "Mempercepat kerusakan produk" }, answer: "B" },
            { level: "Level 2 – Produk dan Produksi", q: "Jika modal sebesar Rp50.000 digunakan untuk membeli bahan baku dan hasil penjualan mencapai Rp80.000, berapakah laba yang diperoleh? (Tuliskan angkanya saja atau format rupiah)", isEssay: true, answer: "30000" },
            { level: "Level 2 – Produk dan Produksi", q: "Yang termasuk biaya produksi adalah....", options: { A: "Bahan baku", B: "Liburan", C: "Bermain game", D: "Hadiah ulang tahun" }, answer: "A" },
            { level: "Level 2 – Produk dan Produksi", q: "Apa tujuan menjaga kualitas produk?", options: { A: "Agar pelanggan puas", B: "Agar produk cepat rusak", C: "Agar harga turun", D: "Agar jumlah pembeli berkurang" }, answer: "A" },
            
            { level: "Level 3 – Pemasaran", q: "Promosi bertujuan untuk....", options: { A: "Mengenalkan produk kepada pelanggan", B: "Mengurangi penjualan", C: "Menambah biaya", D: "Menghilangkan pelanggan" }, answer: "A" },
            { level: "Level 3 – Pemasaran", q: "Media sosial yang dapat digunakan sebagai sarana promosi adalah....", options: { A: "Instagram", B: "Kalkulator", C: "Flashdisk", D: "Printer" }, answer: "A" },
            { level: "Level 3 – Pemasaran", q: "Slogan yang baik sebaiknya....", options: { A: "Sulit diingat", B: "Singkat dan menarik", C: "Sangat panjang", D: "Membingungkan" }, answer: "B" },
            { level: "Level 3 – Pemasaran", q: "Memberikan pelayanan yang ramah kepada pelanggan bertujuan untuk....", options: { A: "Membuat pelanggan kembali membeli", B: "Membuat pelanggan marah", C: "Mengurangi penjualan", D: "Menambah biaya" }, answer: "A" },
            { level: "Level 3 – Pemasaran", q: "Diskon biasanya diberikan untuk....", options: { A: "Menarik minat pembeli", B: "Menurunkan kualitas produk", C: "Membuat produk cepat rusak", D: "Menambah biaya produksi" }, answer: "A" },
            
            { level: "Level 4 – Keuangan", q: "Modal adalah....", options: { A: "Uang yang digunakan untuk memulai usaha", B: "Keuntungan usaha", C: "Pajak", D: "Bonus" }, answer: "A" },
            { level: "Level 4 – Keuangan", q: "Jika jumlah pengeluaran lebih besar daripada pemasukan, maka usaha mengalami.... (Ketik satu kata)", isEssay: true, answer: "rugi" },
            { level: "Level 4 – Keuangan", q: "Pencatatan keuangan dilakukan agar....", options: { A: "Keuangan usaha lebih teratur", B: "Mudah lupa", C: "Sulit menghitung keuntungan", D: "Tidak mengetahui kondisi usaha" }, answer: "A" },
            { level: "Level 4 – Keuangan", q: "Yang termasuk aset usaha adalah....", options: { A: "Mesin produksi", B: "Sampah", C: "Batu di jalan", D: "Daun kering" }, answer: "A" },
            { level: "Level 4 – Keuangan", q: "Keuntungan usaha sebaiknya....", options: { A: "Dikelola dengan baik", B: "Dihabiskan seluruhnya", C: "Dibuang", D: "Tidak dihitung" }, answer: "A" },
            
            { level: "Level 5 – Studi Kasus", q: "Seorang pelanggan mengeluh karena produk yang diterimanya rusak. Apa tindakan yang paling tepat?", options: { A: "Meminta maaf dan memberikan solusi", B: "Mengabaikan pelanggan", C: "Menyalahkan pelanggan", D: "Memblokir pelanggan" }, answer: "A" },
            { level: "Level 5 – Studi Kasus", q: "Penjualan menurun karena muncul banyak pesaing. Langkah terbaik adalah....", options: { A: "Berinovasi", B: "Menutup usaha", C: "Berhenti promosi", D: "Menunggu keadaan berubah" }, answer: "A" },
            { level: "Level 5 – Studi Kasus", q: "Jika pelanggan meminta metode pembayaran digital, sebaiknya....", options: { A: "Menyediakan metode pembayaran digital", B: "Menolak semua pelanggan", C: "Menutup toko", D: "Menghapus produk" }, answer: "A" },
            { level: "Level 5 – Studi Kasus", q: "Apa manfaat menerima kritik dari pelanggan?", options: { A: "Memperbaiki kualitas usaha", B: "Mengurangi jumlah pelanggan", C: "Menghentikan usaha", D: "Mengabaikan masukan" }, answer: "A" },
            { level: "Level 5 – Studi Kasus", q: "Seorang wirausahawan yang sukses adalah orang yang....", options: { A: "Terus belajar, berinovasi, dan pantang menyerah", B: "Cepat menyerah", C: "Tidak mau berkembang", D: "Takut mencoba" }, answer: "A" }
        ];

        function addMessage(text, type, status = '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type} ${status}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateScore(points) {
            score += points;
            scoreBoard.textContent = `Skor: ${score}`;
        }

        function showUIForQuestion(question) {
            optionsContainer.innerHTML = '';
            
            if (question.isEssay) {
                optionsContainer.style.display = 'none';
                textInputWrapper.style.display = 'flex';
                userInput.focus();
            } else {
                textInputWrapper.style.display = 'none';
                optionsContainer.style.display = 'flex';
                
                for (const [key, value] of Object.entries(question.options)) {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = `${key}. ${value}`;
                    btn.onclick = () => handleAnswer(key, value);
                    optionsContainer.appendChild(btn);
                }
            }
        }

        function askQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            const q = questions[currentQuestionIndex];
            
            // Show Level indicator if it's the first question of that level
            if (currentQuestionIndex === 0 || questions[currentQuestionIndex].level !== questions[currentQuestionIndex-1].level) {
                addMessage(`🚀 <b>${q.level}</b>`, 'system');
            }

            let qText = `<b>Soal ${currentQuestionIndex + 1}/25</b><br><br>${q.q}`;
            addMessage(qText, 'gm');
            showUIForQuestion(q);
        }

        function handleAnswer(answerId, answerText = '') {
            if (gameState !== 'playing') return;

            const q = questions[currentQuestionIndex];
            let isCorrect = false;
            let displayAnswer = answerText ? `${answerId}. ${answerText}` : answerId;

            // Player message
            addMessage(displayAnswer, 'player');

            // Validation logic
            if (q.isEssay) {
                let cleanInput = answerId.toString().toLowerCase().replace(/[^a-z0-9]/g, '');
                let cleanAnswer = q.answer.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (cleanInput.includes(cleanAnswer) || cleanAnswer.includes(cleanInput)) {
                    isCorrect = true;
                }
            } else {
                if (answerId.toUpperCase() === q.answer) {
                    isCorrect = true;
                }
            }

            // Feedback & Score
            if (isCorrect) {
                updateScore(100);
                addMessage(`✅ <b>Tepat sekali!</b><br>Skor kamu bertambah +100. (Skor saat ini: ${score})`, 'gm', 'correct');
            } else {
                updateScore(-25);
                let correctAnswerText = q.isEssay ? q.answer : `${q.answer}. ${q.options[q.answer]}`;
                addMessage(`❌ <b>Sayang sekali, jawabanmu kurang tepat.</b><br>Jawaban yang benar adalah: <b>${correctAnswerText}</b>.<br>Skor kamu berkurang -25. (Skor saat ini: ${score})`, 'gm', 'wrong');
            }

            // Next Question
            currentQuestionIndex++;
            optionsContainer.style.display = 'none';
            textInputWrapper.style.display = 'none';
            
            setTimeout(() => {
                askQuestion();
            }, 2000);
        }

        function processTextInput() {
            const val = userInput.value.trim();
            if (!val) return;

            if (gameState === 'intro') {
                if (val.toUpperCase() === 'PLAY') {
                    addMessage(val, 'player');
                    userInput.value = '';
                    gameState = 'playing';
                    
                    addMessage("Sistem berhasil diakses. Menginisialisasi pemulihan data perusahaan...", 'system');
                    setTimeout(askQuestion, 1500);
                } else {
                    addMessage("Ketik 'PLAY' untuk memulai permainan.", 'gm');
                }
            } else if (gameState === 'playing') {
                handleAnswer(val);
                userInput.value = '';
            }
        }

        function endGame() {
            gameState = 'ended';
            textInputWrapper.style.display = 'none';
            optionsContainer.style.display = 'none';
            
            let gelar = "";
            if (score >= 2300) gelar = "🏆 CEO Visioner";
            else if (score >= 1900) gelar = "💼 Entrepreneur Profesional";
            else if (score >= 1500) gelar = "🚀 Pebisnis Muda";
            else if (score >= 1000) gelar = "📈 Calon Wirausahawan";
            else gelar = "🌱 Entrepreneur Trainee";

            let finalMsg = `🎉 <b>MISI SELESAI!</b> 🎉<br><br>
            Waktu habis, investor telah tiba di ruangan rapat.<br>
            Total Skor Akhir kamu adalah: <b>${score} Poin</b>.<br><br>
            Berdasarkan performamu menyelamatkan data perusahaan, gelar kamu adalah:<br>
            <h2 style="color: var(--secondary); margin-top: 10px;">${gelar}</h2><br>
            Terima kasih telah bermain, Tim Entrepreneur! Perusahaan ini bangga memilikimu.`;

            addMessage(finalMsg, 'gm', 'correct');
        }

        // Event Listeners
        sendBtn.addEventListener('click', processTextInput);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') processTextInput();
        });

        // Initialize Game Story
        window.onload = () => {
            addMessage("«Sebuah perusahaan rintisan (startup) milik sekolah sedang mengalami krisis. Investor akan datang dalam waktu satu jam, tetapi seluruh rencana bisnis, strategi pemasaran, dan data keuangan terkunci. Kamu adalah anggota Tim Entrepreneur yang harus menyelesaikan berbagai tantangan kewirausahaan untuk membuka setiap sistem yang terkunci dan menyelamatkan perusahaan sebelum waktu habis.»\n\nKetik \"PLAY\" untuk memulai permainan.", 'gm');
            userInput.focus();
        };

    </script>
</body>
</html>
